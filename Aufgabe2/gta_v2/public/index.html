<!DOCTYPE html>

<!-- File origin: VS1LAB A1a -->

<html lang="en">

<head>
    <link rel='stylesheet' href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css'
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
          crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
            crossorigin="">
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoTagApp</title>
    <link rel="stylesheet" href="./stylesheets/style.css">
    <link rel="icon" href="favicon.ico">
</head>

<body>
<header class="header">
    <img src="./images/location.png" class="header__image" alt="an image of a map and location">
    <h1 class="header__title">GeoTagApp</h1>
    <nav class="header__navigation">
        <a href="#">About</a> | <a href="#">Help</a> | <a href="/">Home</a>
    </nav>
</header>

<main class="main">
    <div class="row">
        <section class="tagging col-4">
            <h2>Tagging</h2>

            <!-- ############### VS1Lab 1a Form 1 Start -->
            <form id="tag-form" action="/tagging" method="post">
<!--             the role of the fieldset is to group related form controls together-->
                <fieldset>
                    <legend>Add a new GeoTag</legend>

                    <label for="latitude">Latitude:</label>
                    <input type="text"
                           id="latitude"
                           name="latitude"
                           placeholder="49.01379"
                           autocomplete="off">

                    <label for="longitude">Longitude:</label>
                    <input type="text"
                           id="longitude"
                           name="longitude"
                           placeholder="8.390071"
                           autocomplete="off">

                    <label for="name">Name:</label>
                    <input type="text"
                           id="name"
                           name="name"
                           placeholder="e.g. Central Berlin"
                           required
                           maxlength="10"
                           autocomplete="off">

                    <label for="hashtag">Hashtag:</label>
                    <input type="text"
                           id="hashtag"
                           name="hashtag"
                           placeholder="e.g. #ber"
                           autocomplete="off"
                           pattern="#[a-zA-Z]{0,10}">
                    <input type="submit" value="Add Tag">
                </fieldset>
            </form>
            <!-- ############### VS1Lab 1a Form 1 End -->
        </section>

        <section class="discovery col-8">
            <h2 class="discovery__title">Discovery</h2>

            <!-- ############### VS1Lab 1a Form 2 Start -->
            <form class="discovery__search" id="discoveryFilterForm" action="/discovery" method="post">
                <fieldset>
                    <legend>Search</legend>
                    <label for="searchterm">Search term or keywords:</label>

                    <input type="text"
                           id="searchterm"
                           name="searchterm"
                           placeholder="e.g. Berlin"
                           autocomplete="off"
                           >

                    <input type="hidden"
                           id="discovery-latitude"
                           name="latitude"
                           value="49.01379">

                    <input type="hidden"
                           id="discovery-longitude"
                           name="longitude"
                           value="8.390071">

                    <input type="submit" value="Search">
                </fieldset>
            </form>
            <!-- ############### VS1Lab 1a Form 2 End -->

            <div class="discovery__wrapper row">
                <div class="discovery__taglist col-7">
                    <ul class="discovery__results" id="discoveryResults">
                        <li>Castle (49.01379, 8.404435) #sight</li>
                        <li>IWI (49.01379, 8.390071) #edu</li>
                    </ul>
                </div>

                <div id="map" class="discovery__map col-5">
                    <img src="./images/mapview.jpg" alt="a map with locations" id="mapView" />
                    <p>Result map</p>
                </div>
            </div>
        </section>
    </div>
</main>

<footer class="footer">
    <span>(c) 2021/22 HKA_IWI_VSYS</span>
</footer>

<script src="./javascripts/geotagging.js"></script>
</body>

</html>
